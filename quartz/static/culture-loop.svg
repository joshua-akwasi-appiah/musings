<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">The Culture Loop</title>
  <desc id="desc">An original diagram showing how leaders model behaviour, teams accept it, behaviours repeat, and culture becomes the environment everyone experiences.</desc>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#d9d2c8" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3e362e"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#fff8ed"/>
  <rect width="1200" height="1500" fill="url(#grid)" opacity="0.78"/>

  <text x="600" y="132" text-anchor="middle" fill="#3e362e" font-family="Georgia, serif" font-size="72" font-weight="700">The Culture Loop</text>
  <text x="600" y="196" text-anchor="middle" fill="#5f5245" font-family="Arial, sans-serif" font-size="29">How everyday behaviour becomes the environment everyone experiences</text>

  <circle cx="600" cy="750" r="336" fill="#f1ede6" stroke="#3e362e" stroke-width="5"/>
  <circle cx="600" cy="750" r="210" fill="#d0a34d" stroke="#3e362e" stroke-width="5"/>

  <path d="M600 475 C748 475 850 578 850 725" fill="none" stroke="#3e362e" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M875 750 C875 898 772 1000 625 1000" fill="none" stroke="#3e362e" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M600 1025 C452 1025 350 922 350 775" fill="none" stroke="#3e362e" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M325 750 C325 602 428 500 575 500" fill="none" stroke="#3e362e" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" fill="#3e362e">
    <rect x="365" y="260" width="470" height="112" rx="28" fill="#fff8ed" stroke="#3e362e" stroke-width="4"/>
    <circle cx="420" cy="316" r="23" fill="#d0a34d"/>
    <text x="463" y="307" font-size="26" font-weight="700">1. WHAT LEADERS</text>
    <text x="463" y="341" font-size="26" font-weight="700">MODEL</text>

    <rect x="900" y="628" width="250" height="145" rx="28" fill="#fff8ed" stroke="#3e362e" stroke-width="4"/>
    <circle cx="942" cy="700" r="20" fill="#d0a34d"/>
    <text x="976" y="680" font-size="19" font-weight="700">2. WHAT</text>
    <text x="976" y="710" font-size="19" font-weight="700">TEAMS</text>
    <text x="976" y="740" font-size="19" font-weight="700">ACCEPT</text>

    <rect x="365" y="1130" width="470" height="112" rx="28" fill="#fff8ed" stroke="#3e362e" stroke-width="4"/>
    <circle cx="420" cy="1186" r="23" fill="#d0a34d"/>
    <text x="463" y="1177" font-size="26" font-weight="700">3. WHAT GETS</text>
    <text x="463" y="1211" font-size="26" font-weight="700">REPEATED</text>

    <rect x="50" y="628" width="250" height="145" rx="28" fill="#fff8ed" stroke="#3e362e" stroke-width="4"/>
    <circle cx="92" cy="700" r="20" fill="#d0a34d"/>
    <text x="126" y="680" font-size="19" font-weight="700">4. WHAT</text>
    <text x="126" y="710" font-size="19" font-weight="700">CULTURE</text>
    <text x="126" y="740" font-size="19" font-weight="700">BECOMES</text>
  </g>

  <g text-anchor="middle" fill="#3e362e" font-family="Arial, sans-serif">
    <text x="600" y="680" font-size="31" font-weight="700">WHAT PEOPLE SEE</text>
    <text x="600" y="724" font-size="31" font-weight="700">REWARDED</text>
    <text x="600" y="779" font-size="25">becomes what feels normal</text>
    <path d="M474 822 H726" stroke="#3e362e" stroke-width="4"/>
    <text x="600" y="868" font-size="20">Openness · Ownership</text>
    <text x="600" y="899" font-size="20">Follow-through</text>
    <text x="600" y="936" font-size="18">or Silence · Blame · Waiting</text>
  </g>

  <rect x="118" y="1316" width="964" height="92" rx="46" fill="#d0a34d" stroke="#3e362e" stroke-width="4"/>
  <text x="600" y="1374" text-anchor="middle" fill="#3e362e" font-family="Arial, sans-serif" font-size="32" font-weight="700">DESIGN FOR THE BEHAVIOUR YOU WANT REPEATED</text>
</svg>
